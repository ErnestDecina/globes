<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Meeting Notes</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }

      #root {
        width: 100%;
        height: 100vh;
      }

      .header {
        padding: 16px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #f3f4f6;
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-title h2 {
        margin: 0;
        font-size: 18px;
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .language-select {
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid #d1d5db;
        background-color: white;
        font-size: 14px;
      }

      .content {
        padding: 16px;
        overflow-y: auto;
        flex: 1;
      }

      textarea {
        width: 100%;
        height: calc(100vh - 140px);
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #d1d5db;
        resize: none;
        font-size: 14px;
        line-height: 1.5;
        font-family: monospace;
        box-sizing: border-box;
      }

      .footer {
        padding: 16px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        background-color: #f3f4f6;
      }

      .btn {
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btn-primary {
        background-color: #0394fc;
        color: white;
        border: none;
      }

      .btn-secondary {
        background-color: #f3f4f6;
        color: #374151;
        border: 1px solid #d1d5db;
      }

      .btn-success {
        background-color: #2cfc03;
        color: white;
        border: none;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    </style>
    <!-- Load React from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Fallback UI that will show if React doesn't load -->
      <div class="container">
        <div class="header">
          <div class="header-title">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" x2="8" y1="13" y2="13" />
              <line x1="16" x2="8" y1="17" y2="17" />
              <line x1="10" x2="8" y1="9" y2="9" />
            </svg>
            <h2>Globes Meeting Notes</h2>
          </div>
          <div class="header-controls">
            <select id="language-select" class="language-select">
              <option value="en">English</option>
              <option value="ko">한국어 (Korean)</option>
            </select>
            <div id="room-name">Room: Loading...</div>
          </div>
        </div>
        <div class="content">
          <textarea
            id="notes-textarea"
            readonly
            placeholder="Loading AI Meeting Notes..."
          ></textarea>
        </div>
        <div class="footer">
          <div class="actions">
            <button id="generate-btn" class="btn btn-primary">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
              Generate Notes
            </button>
            <button id="copy-btn" class="btn btn-secondary">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                <path
                  d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                />
              </svg>
              Copy
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Simple script to handle basic functionality without React
      window.onload = function () {
        if (window.opener) {
          window.opener.postMessage(
            {
              type: "aiNotesWindowReady",
            },
            "*"
          );
        }
      };

      document.addEventListener("DOMContentLoaded", function () {
        let notes = "";
        const textarea = document.getElementById("notes-textarea");
        const generateBtn = document.getElementById("generate-btn");
        const copyBtn = document.getElementById("copy-btn");
        const saveBtn = document.getElementById("save-btn");
        const roomNameElement = document.getElementById("room-name");
        const languageSelect = document.getElementById("language-select");
        
        // Current language
        let currentLanguage = "en";
        let uuid = '';

        // API endpoint for generating notes
     

        // Language templates
        const templates = {
          en: {
            placeholder: "Loading AI Meeting Notes...",
            copyButton: "Copy",
            copiedMessage: "Copied!",
            roomPrefix: "Room: ",
            generateButton: "Generate Notes",
            generatingButton: "Generating...",
            errorMessage: "Failed to generate notes. Please try again.",
            defaultNotes: function() {
              return `# Meeting Notes - ${new Date().toLocaleString()}\n\n## This is a placeholder. Click "Generate Notes" to create meeting notes.`;
            }
          },
          ko: {
            placeholder: "AI 회의 노트 로딩 중...",
            copyButton: "복사",
            copiedMessage: "복사됨!",
            roomPrefix: "회의실: ",
            generateButton: "노트 생성",
            generatingButton: "생성 중...",
            errorMessage: "노트 생성에 실패했습니다. 다시 시도해주세요.",
            defaultNotes: function() {
              return `# 회의 노트 - ${new Date().toLocaleString()}\n\n## 이것은 자리표시자입니다. "노트 생성"을 클릭하여 회의 노트를 생성하세요.`;
            }
          }
        };

        // Update UI language
        function updateLanguage(lang) {
          currentLanguage = lang;
          
          // Update placeholder
          textarea.placeholder = templates[lang].placeholder;
          
          // Update generate button text
          if (generateBtn) {
            generateBtn.innerHTML = `
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
              ${templates[lang].generateButton}
            `;
          }
          
          // Update copy button text
          copyBtn.innerHTML = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path
                d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
              />
            </svg>
            ${templates[lang].copyButton}
          `;
          
          // Update room name prefix if it exists
          if (roomNameElement.textContent.includes(":")) {
            const roomValue = roomNameElement.textContent.split(":")[1].trim();
            roomNameElement.textContent = templates[lang].roomPrefix + roomValue;
          }
          
          // Notify parent window of language change
          if (window.opener) {
            window.opener.postMessage(
              {
                type: "languageChanged",
                language: lang
              },
              "*"
            );
          }
        }

        // Function to generate notes via GET request
        function generateNotes() {
          generateBtn.innerHTML = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48 2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48 2.83-2.83"/>
            </svg>
            ${templates[currentLanguage].generatingButton}
          `;
          generateBtn.disabled = true;
          
          // Use the UUID if available as a parameter
          const API_ENDPOINT = `http://localhost:3000/api/v1/meetings/${uuid}/summarize?lang=${currentLanguage}`;

        
          fetch(API_ENDPOINT)
            .then(response => {
              if (!response.ok) {
                throw new Error('Network response was not ok');
              }
              return response.json();
            })
            .then(data => {
              console.log(data);
              textarea.value = data.summary;
              notes = data.summary;
              
              // Notify parent window of content update
              if (window.opener) {
                window.opener.postMessage(
                  {
                    type: "notesUpdated",
                    content: data.summary,
                  },
                  "*"
                );
              }
            })
            .catch(error => {
              console.error('Error generating notes:', error);
              // Display error in textarea
              textarea.value = templates[currentLanguage].errorMessage;
              
              // Use default notes as fallback
              setTimeout(() => {
                const defaultNotes = templates[currentLanguage].defaultNotes();
                textarea.value = defaultNotes;
                notes = defaultNotes;
              }, 2000);
            })
            .finally(() => {
              // Reset button state
              generateBtn.innerHTML = `
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                  <path d="m9 12 2 2 4-4"/>
                </svg>
                ${templates[currentLanguage].generateButton}
              `;
              generateBtn.disabled = false;
            });
        }

        // Language change event listener
        languageSelect.addEventListener("change", function() {
          updateLanguage(this.value);
        });

        // Listen for messages from parent window
        window.addEventListener("message", function (event) {
          console.log(event);
          if (event.data && event.data.type === "notesContent") {
            textarea.value = event.data.content;
            notes = event.data.content;
          }

          if (event.data && event.data.type === "roomName") {
            roomNameElement.textContent = templates[currentLanguage].roomPrefix + event.data.roomName;
          }

          if(event.data && event.data.type === "uuid") {
            uuid = event.data.uuid;
          }
          
          if(event.data && event.data.type === "setLanguage") {
            languageSelect.value = event.data.language;
            updateLanguage(event.data.language);
          }
        });

        // Send ready message to parent
        if (window.opener) {
          window.opener.postMessage(
            {
              type: "aiNotesWindowReady",
            },
            "*"
          );
        }

        // Set up event handlers for generate button
        if (generateBtn) {
          generateBtn.addEventListener("click", function() {
            generateNotes();
          });
        }

        copyBtn.addEventListener("click", function () {
          navigator.clipboard.writeText(textarea.value);
          const originalText = copyBtn.textContent.trim();
          copyBtn.textContent = templates[currentLanguage].copiedMessage;
          setTimeout(() => {
            copyBtn.innerHTML = `
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                <path
                  d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                />
              </svg>
              ${templates[currentLanguage].copyButton}
            `;
          }, 2000);
        });

        if (saveBtn) {
          saveBtn.addEventListener("click", function () {
            if (window.opener) {
              window.opener.postMessage(
                {
                  type: "notesSaved",
                  content: textarea.value,
                },
                "*"
              );
            }
            const originalText = saveBtn.textContent;
            saveBtn.textContent = currentLanguage === "en" ? "Saved!" : "저장됨!";
            setTimeout(() => {
              saveBtn.textContent = originalText;
            }, 2000);
          });
        }

        textarea.addEventListener("input", function () {
          if (window.opener) {
            window.opener.postMessage(
              {
                type: "notesUpdated",
                content: textarea.value,
              },
              "*"
            );
          }
        });

        // Handle window close
        window.onbeforeunload = function () {
          if (window.opener) {
            window.opener.postMessage(
              {
                type: "aiNotesWindowClosed",
                content: textarea.value,
              },
              "*"
            );
          }
        };
        
        // Initialize with default language
        updateLanguage(currentLanguage);
      });
    </script>
  </body>
</html>
